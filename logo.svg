<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffb84d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7a18;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2f42;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d1820;stop-opacity:0.9" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="280" height="80" rx="18" fill="url(#bgGrad)" stroke="rgba(255,165,0,0.35)" stroke-width="1.5"/>
  
  <!-- Subtle glow circles -->
  <circle cx="260" cy="15" r="22" fill="rgba(255,122,24,0.08)"/>
  <circle cx="20" cy="70" r="18" fill="rgba(82,199,234,0.06)"/>
  
  <!-- Main Text: MatchAdda -->
  <text x="25" y="58" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="48" font-weight="900" letter-spacing="0.8" fill="url(#textGrad)" filter="url(#softGlow)">
    MatchAdda
  </text>
  
  <!-- Tagline -->
  <text x="25" y="74" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#ff9a3d" letter-spacing="1.2">
    CRICKET FAN ADDA
  </text>
  
  <!-- Decorative accent dots -->
  <circle cx="272" cy="25" r="2" fill="#ff7a18" opacity="0.7"/>
  <circle cx="278" cy="18" r="1.5" fill="#ffd166" opacity="0.6"/>
</svg>